server:
  port: 8080
  servlet:
    context-path: /lego-management/api

spring:
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE"
    driverClassName: org.h2.Driver
    username: user
    password: password
    platform: h2
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    enabled: false
    hibernate:
      ddl-auto: none    
